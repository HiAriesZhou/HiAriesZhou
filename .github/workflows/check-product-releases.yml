name: Check product releases

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: product-release-monitor
  cancel-in-progress: false

jobs:
  check-releases:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: node --test scripts/check-project-releases.test.mjs
      - run: node scripts/check-project-releases.mjs --write
        env:
          GITHUB_TOKEN: ${{ github.token }}
