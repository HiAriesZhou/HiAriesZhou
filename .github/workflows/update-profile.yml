name: Update profile

on:
  schedule:
    # Minute 17 avoids the crowded top of each hour. GitHub may delay scheduled runs.
    - cron: "17 */3 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [bookmark-assistant-release, x-toc-release]

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  update-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test updater
        run: node --test scripts/*.test.mjs

      - name: Update README activity
        run: node scripts/update-profile.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REPOS: HiAriesZhou/xtoc,HiAriesZhou/litecontext,HiAriesZhou/DashBye,HiAriesZhou/Hairpin,HiAriesZhou/Howler,HiAriesZhou/TMD
          BOOKMARK_ASSISTANT_RELEASE_PAYLOAD: ${{ toJson(github.event.client_payload) }}
          BLOG_FEED_URL: https://arieszhou.com/rss.en.xml
          POST_LIMIT: 3
          TITLE_MAX_LENGTH: 60

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/bookmark-assistant-release.json
          git diff --cached --quiet || git commit -m "Update profile activity"
          git push
